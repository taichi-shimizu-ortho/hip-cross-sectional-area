[project]
name = "bayesianunet"
version = "0.1.0"
requires-python = ">=3.10,<3.12" 
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch",
    "torchvision",
    "tqdm>=4.70.0",
    "wandb>=0.30.0",
]
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true